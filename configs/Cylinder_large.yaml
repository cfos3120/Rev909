# Metadata
wandb:
  entity: "cfos3120-acfr-usyd"
  project: "Cylinder"
  group: "large"
  sweep_n: 27

peripheral:
  device: [0]
  seed: 42
  
# parameters will get updated with sweeps
parameters:
  
  # Net Parameters
  model_name: 'FNO'
  modes: 12
  width: 32

  # Training Parameters
  epochs: 50
  learning_rate: 0.005 #0.0005
  scheduler_step: 10
  scheduler_gamma: 0.5
  batch_size: 50
  soblev_norm_order: 1
  dissipation: True
  diss_xy: True
  input_xy: True # this needs to be on for long rollout

  # 
  grad_method: 'FVM'  # 'autograd' | 'FDM' | 'FVM' | 'Spectral'
  volume_weighting: False # Weights derivative fields before loss calculation
  loss_order_weights: [1,1,1] # takes list e.g. [1,1,1] for H0, H1, H2
  dissipation_weight: 0.005

dataset_params:

  # Dataset dependent Net configs
  input_dim: 2
  output_dim: 2

  # Dataset Partition
  name: Cylinder
  dataset_name: RAS_Re100k_midres.npy
  openfoam_case_dir: cylinder_mno_turb5_midres/case.foam
  sub: 1
  split: 0.9
  radii: 129 # these are mesh dependent (should be precalculated)
  angles: 636
  